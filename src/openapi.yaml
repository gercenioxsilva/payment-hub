openapi: 3.0.3
info:
  title: ClickPay Hub POC API
  version: "0.2.0"
tags:
  - name: ingress
    description: Ingress API (idempotency + validation) for client-facing payment requests.
  - name: webhook
    description: Webhook receiver for provider callbacks (normalize and update status).
servers:
  - url: http://localhost:8080
paths:
  /payments/init:
    post:
      summary: Start payment (generic initializer)
      tags: [ingress]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartPaymentRequest'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartPaymentResponseV2'
  /pix/payments:
    post:
      summary: Create PIX payment (async)
      tags: [ingress]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePixPaymentRequest'
      responses:
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayPaymentResponse'
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePixPaymentResponse'
  /card/credit/payments:
    post:
      summary: Authorize credit card payment (async model, returns 202)
      tags: [ingress]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCardPaymentRequest'
      responses:
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayPaymentResponse'
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCardPaymentResponse'
  /card/debit/payments:
    post:
      summary: Authorize debit card payment (async model, returns 202)
      tags: [ingress]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCardPaymentRequest'
      responses:
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayPaymentResponse'
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCardPaymentResponse'
  /payments/{paymentId}:
    get:
      summary: Get payment status
      tags: [ingress]
      parameters:
        - in: path
          name: paymentId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
  /webhooks/pix:
    post:
      summary: PIX webhook (mock)
      tags: [webhook]
      servers:
        - url: http://localhost:8081
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PixWebhook'
      responses:
        "200": { description: OK }
  /webhooks/card:
    post:
      summary: Card webhook (mock capture/settlement)
      tags: [webhook]
      servers:
        - url: http://localhost:8081
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardWebhook'
      responses:
        "200": { description: OK }

components:
  schemas:
    StartPaymentRequest:
      type: object
      properties:
        tokenSession: { type: string }
        partnerUniqueID: { type: string }
        customer: { $ref: '#/components/schemas/StartCustomer' }
        vendor: { $ref: '#/components/schemas/StartVendor' }
        paymentItems: { $ref: '#/components/schemas/StartPaymentItems' }
        paymentData: { $ref: '#/components/schemas/StartPaymentData' }
        frontData: { $ref: '#/components/schemas/StartFrontData' }
        isMerchantInitiated: { type: boolean }
        extraInfo: { type: string }
    StartCustomer:
      type: object
      properties:
        iD: { type: string }
        email: { type: string }
        name: { type: string }
        document: { type: string }
        documentType: { type: string }
        birthDate: { type: string, format: date }
        gender: { type: string }
        daysSinceRegistration: { type: integer }
        daysSinceLastLogin: { type: integer }
        daysSinceLastPasswordChange: { type: integer }
        daysSinceLastPurchase: { type: integer }
        daysSinceFirstPurchase: { type: integer }
    StartVendor:
      type: object
      properties:
        mCC: { type: string }
        name: { type: string }
        code: { type: string }
        industry: { type: string }
        document: { type: string }
        documentType: { type: string }
        daysSinceRegistration: { type: integer }
        daysSinceLastSell: { type: integer }
        daysSinceFirstSell: { type: integer }
    StartPaymentItems:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StartItem'
    StartItem:
      type: object
      properties:
        detailUniqueID: { type: string }
        sku: { type: string }
        ean: { type: string }
        amount: { type: number, format: double }
        productID: { type: integer }
        productDescription: { type: string }
        categoryID: { type: integer }
        categoryName: { type: string }
        itemQuantity: { type: integer }
        split: { $ref: '#/components/schemas/StartSplit' }
        antiFraud: { $ref: '#/components/schemas/StartAntiFraud' }
        presentMessage: { type: string }
    StartSplit:
      type: object
      properties:
        merchantID: { type: string }
        merchantDocument: { type: string }
        merchantDocumentType: { type: string }
        percent: { type: number, format: double }
        amount: { type: number, format: double }
    StartAntiFraud:
      type: object
      properties:
        ean: { type: string }
        deliveryAddressee: { type: string }
        isEmailConfirmed: { type: boolean }
        wasCardChanged: { type: boolean }
        isPhoneNumberConfirmed: { type: boolean }
        loginCredential: { type: string }
        isVIPClient: { type: boolean }
        isEmployeeClient: { type: boolean }
        wasAccountModified: { type: boolean }
        daysSinceLastAccountChange: { type: integer }
        fidelityNumber: { type: string }
        daysSinceFidelityRegistration: { type: integer }
        daysSinceLastPointsExchange: { type: integer }
        fidelityBalance: { type: integer }
        amountPointsLastExchange: { type: integer }
        phoneChargesInLast30Days: { type: integer }
        minutesChargedInLast30Days: { type: integer }
        data: { $ref: '#/components/schemas/StartKeyValue' }
    StartKeyValue:
      type: object
      properties:
        key: { type: string }
        value: { type: string }
    StartPaymentData:
      type: object
      properties:
        paymentMethods:
          type: array
          items:
            $ref: '#/components/schemas/StartPaymentMethod'
        antiFraud: { $ref: '#/components/schemas/StartAntiFraud' }
        deliveryAddress: { $ref: '#/components/schemas/StartAddress' }
        countrycode: { type: string }
        amount: { type: number, format: double }
        salesChannel: { type: string }
    StartPaymentMethod:
      type: object
      properties:
        paymentMethodType: { type: string }
        amount: { type: number, format: double }
        installments: { type: integer }
        cardInfo: { $ref: '#/components/schemas/StartCardInfo' }
        boletoInfo: { $ref: '#/components/schemas/StartBoletoInfo' }
        customer: { $ref: '#/components/schemas/StartCustomer' }
        pix: { $ref: '#/components/schemas/StartPixInfo' }
        softDescriptor: { type: string }
    StartCardInfo:
      type: object
      properties:
        token: { type: string, format: uuid }
        tokenProvider: { type: string }
        cardHolderName: { type: string }
        alias: { type: string }
        expirationMonth: { type: integer }
        expirationYear: { type: integer }
        billingInfo: { $ref: '#/components/schemas/StartBillingInfo' }
        externalProviderInfo: { type: string }
        brandName: { type: string }
        tokenSingleUse: { type: integer }
        saveCard: { type: boolean }
    StartBillingInfo:
      type: object
      properties:
        number: { type: string }
        document: { type: string }
        documentType: { type: string }
        name: { type: string }
        phone: { type: string }
        address: { $ref: '#/components/schemas/StartAddress' }
    StartBoletoInfo:
      type: object
      properties:
        billingInfo: { $ref: '#/components/schemas/StartBillingInfo' }
    StartPixInfo:
      type: object
      properties:
        name: { type: string }
        document: { type: string }
        documentType: { type: string }
        expirationSeconds: { type: integer }
    StartAddress:
      type: object
      properties:
        street: { type: string }
        number: { type: string }
        complement: { type: string }
        neighborhood: { type: string }
        city: { type: string }
        state: { type: string }
        country: { type: string }
        postalCode: { type: string }
        phone: { type: string }
    StartFrontData:
      type: object
      properties:
        sessionID: { type: string }
        ipAddress: { type: string }
        acceptHeader: { type: string }
        userAgent: { type: string }
        cookiesAccepted: { type: boolean }
    StartPaymentResponse:
      type: object
      required: [paymentId, status, method, provider]
      properties:
        paymentId: { type: string }
        status: { type: string }
        method: { type: string }
        provider: { type: string }
    StartPaymentResponseV2:
      type: object
      required: [status, methods, paymentKey, partnerUniqueId, code, message, operationId]
      properties:
        status: { type: string }
        methods:
          type: array
          items:
            $ref: '#/components/schemas/MethodReturn'
        paymentKey: { type: string }
        partnerUniqueId: { type: string }
        code: { type: integer }
        message: { $ref: '#/components/schemas/APIMessage' }
        operationId: { type: string }
    MethodReturn:
      type: object
      properties:
        methodType: { type: string }
        status: { type: string }
        methodId: { type: integer }
        operationId: { type: string }
        methodKey: { type: string }
        message: { $ref: '#/components/schemas/APIMessage' }
        redirectInfo: { $ref: '#/components/schemas/RedirectInfo' }
        acquirer:
          type: array
          items: { $ref: '#/components/schemas/AcquirerInfo' }
        antifraud:
          type: array
          items: { $ref: '#/components/schemas/AntifraudInfo' }
        pixInfo: { $ref: '#/components/schemas/PixReturnInfo' }
        cryptoInfo: { $ref: '#/components/schemas/CryptoReturnInfo' }
    APIMessage:
      type: object
      properties:
        source: { type: integer }
        code: { type: string }
        message: { type: string }
        info: { type: string }
    RedirectInfo:
      type: object
      properties:
        url: { type: string }
    AcquirerInfo:
      type: object
      properties:
        name: { type: string }
        status: { type: string }
        message: { type: string }
    AntifraudInfo:
      type: object
      properties:
        name: { type: string }
        status: { type: string }
        message: { type: string }
    PixReturnInfo:
      type: object
      properties:
        qRContent: { type: string }
        qrCopyPaste: { type: string }
        qRImage: { type: string }
    CryptoReturnInfo:
      type: object
      properties:
        coinValue: { type: string }
        coinRateCurrency: { type: string }
        coinAddr: { type: string }
        coinQRCodeUrl: { type: string }
        coin: { type: string }
    Money:
      type: object
      required: [valueCents, currency]
      properties:
        valueCents: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, enum: [BRL] }
    Payer:
      type: object
      required: [name, document, bank]
      properties:
        name: { type: string }
        document: { type: string }
        bank: { type: string }
    PixData:
      type: object
      required: [key, payerMessage, expiresInSeconds]
      properties:
        key: { type: string }
        payerMessage: { type: string }
        expiresInSeconds: { type: integer, minimum: 60, maximum: 86400 }
    CreatePixPaymentRequest:
      type: object
      required: [orderId, amount, payer, pix]
      properties:
        orderId: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        payer: { $ref: '#/components/schemas/Payer' }
        pix: { $ref: '#/components/schemas/PixData' }
    CreatePixPaymentResponse:
      type: object
      required: [paymentId, status, method, provider, pix]
      properties:
        paymentId: { type: string }
        status: { type: string }
        method: { type: string, enum: [PIX] }
        provider: { type: string }
        pix:
          type: object
          required: [txid, expiresAt, qrCodeBase64, brCode, location]
          properties:
            txid: { type: string }
            expiresAt: { type: string, format: date-time }
            qrCodeBase64: { type: string }
            brCode: { type: string }
            location: { type: string }
    Card:
      type: object
      required: [holderName, number, expMonth, expYear, cvv, brand]
      properties:
        holderName: { type: string }
        number: { type: string }
        expMonth: { type: integer, minimum: 1, maximum: 12 }
        expYear: { type: integer }
        cvv: { type: string }
        brand: { type: string, example: VISA }
    CreateCardPaymentRequest:
      type: object
      required: [orderId, amount, card]
      properties:
        orderId: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        card: { $ref: '#/components/schemas/Card' }
    CreateCardPaymentResponse:
      type: object
      required: [paymentId, status, method, provider]
      properties:
        paymentId: { type: string }
        status: { type: string }
        method: { type: string, enum: [CARD_CREDIT, CARD_DEBIT] }
        provider: { type: string }
        card:
          type: object
          properties:
            maskedPan: { type: string }
            brand: { type: string }
            authCode: { type: string }
    ReplayPaymentResponse:
      type: object
      required: [paymentId, status, replay]
      properties:
        paymentId: { type: string }
        status: { type: string }
        replay: { type: boolean }
    PaymentIntent:
      type: object
      properties:
        PaymentID: { type: string }
        OrderID: { type: string }
        IdempotencyKey: { type: string }
        AmountCents: { type: integer, format: int64 }
        Currency: { type: string }
        Method: { type: string }
        Status: { type: string }
        Provider: { type: string }
        E2EID: { type: string, nullable: true }
        TXID: { type: string, nullable: true }
        PayerName: { type: string, nullable: true }
        PayerDocument: { type: string, nullable: true }
        PayerBank: { type: string, nullable: true }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
    PixWebhook:
      type: object
      required: [paymentId, status, e2eId, txid]
      properties:
        paymentId: { type: string }
        status: { type: string, enum: [PAID, FAILED] }
        e2eId: { type: string }
        txid: { type: string }
    CardWebhook:
      type: object
      required: [paymentId, status]
      properties:
        paymentId: { type: string }
        status: { type: string, enum: [PAID, FAILED] }
